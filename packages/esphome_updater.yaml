substitutions:
  project_version: "1.1.2"  # Define the version number once here

esphome:
  name: hall-9
  friendly_name: "Hall 9 Room 1"
  project:
    name: "chriopter.hall-9"
    version: "${project_version}"

logger:
  level: DEBUG  # Enable detailed logging for troubleshooting

http_request:
  id: http_client
  useragent: esphome/hall-9
  timeout: 10s
  verify_ssl: true  # Enable SSL verification for security

# Define a global variable to store the latest version
globals:
  - id: latest_version_value
    type: std::string
    initial_value: ""  # Initially empty

# Define text sensors for version tracking
text_sensor:
  - platform: template
    name: "Hall 9 Installed Version"
    id: current_version
    icon: "mdi:package-variant"
    update_interval: 24h
    lambda: |-
      return std::string("${project_version}");

  - platform: template
    name: "Hall 9 Latest Version"
    id: latest_version
    icon: "mdi:package-variant-closed"
    lambda: |-
      if (id(latest_version_value).empty()) {
        return { "Unknown" };
      } else {
        return { id(latest_version_value) };
      }
    update_interval: never  # Manual updates only

# Define a binary sensor to indicate if an update is available
binary_sensor:
  - platform: template
    name: "Hall 9 Update Available"
    id: update_available
    device_class: update
    lambda: |-
      if (!id(latest_version).has_state()) return false;
      return id(latest_version).state != id(current_version).state;

# Define a button to manually check for updates
button:
  - platform: template
    name: "Hall 9 Check for Updates" 
    icon: "mdi:update"
    on_press:
      - http_request.get:
          id: http_client
          url: "https://api.github.com/repos/chriopter/hall-9/releases/latest"
      - lambda: |-
          auto response = http_client.response;
          if (response.success) {
            // Parse the JSON response to extract the tag_name
            std::string tag = response.json["tag_name"].as<std::string>();
            ESP_LOGD("button", "Latest version: %s", tag.c_str());
          } else {
            ESP_LOGD("button", "HTTP request failed");
          }
