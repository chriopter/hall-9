substitutions:
  project_version: "1.1.1"  # Define the version number once here

esphome:
  name: hall-9
  friendly_name: "Hall 9 Room 1"
  project:
    name: "chriopter.hall-9"
    version: "${project_version}"  # Reference the substitution here

# Add HTTP client for GitHub API
http_request:
  useragent: esphome/hall-9
  timeout: 10s
  id: http_client
  verify_ssl: false  # Consider setting to true for security

# JSON Text Sensor for Latest Version
text_sensor:
  - platform: template
    name: "Hall 9 Installed Version"
    id: current_version
    icon: "mdi:package-variant"
    update_interval: 24h
    lambda: |-
      return std::string("${project_version}");

  - platform: json
    name: "Latest Version"
    id: latest_version
    icon: "mdi:package-variant-closed"
    json_url: "https://api.github.com/repos/chriopter/hall-9/releases/latest"
    update_interval: 24h
    json_path: "$.tag_name"
    on_json_received:
      then:
        - text_sensor.template.publish:
            id: latest_version
            state: !lambda "return x;"

# Button to Check for Updates Manually
button:
  - platform: template
    name: "Check for Updates"
    icon: "mdi:update"
    on_press:
      then:
        - http_request.get:
            id: http_client
            url: "https://api.github.com/repos/chriopter/hall-9/releases/latest"
            on_response:
              then:
                - lambda: |-
                    if (response->status_code == 200) {
                      // Publish the latest version using JSON parsing
                      id(latest_version).publish_state(response->body);
                    } else {
                      ESP_LOGW("update", "Failed to fetch latest version: HTTP %d", response->status_code);
                    }

# Binary sensor to detect when update is available
binary_sensor:
  - platform: template
    name: "Update Available"
    id: update_available
    device_class: update
    lambda: |-
      if (!id(latest_version).has_state()) return false;
      return id(latest_version).state != id(current_version).state;
