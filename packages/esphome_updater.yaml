substitutions:
  project_version: "1.1.1"  # Define the version number once here

esphome:
  name: hall-9
  friendly_name: "Hall 9 Room 1"
  project:
    name: "chriopter.hall-9"
    version: "${project_version}"

http_request:
  id: http_client
  useragent: esphome/hall-9
  timeout: 10s
  verify_ssl: true  # Enable SSL verification for security

# Define a global variable to store the latest version
globals:
  - id: latest_version_value
    type: std::string
    initial_value: ""  # Initially empty

# Define text sensors for version tracking
text_sensor:
  - platform: template
    name: "Hall 9 Installed Version"
    id: current_version
    icon: "mdi:package-variant"
    lambda: |-
      return { "${project_version}" };  # Correctly returning an optional string
    update_interval: never  # No automatic updates needed

  - platform: template
    name: "Latest Version"
    id: latest_version
    icon: "mdi:package-variant-closed"
    lambda: |-
      if (id(latest_version_value).empty()) {
        return { "Unknown" };  # Correctly returning an optional string
      } else {
        return { id(latest_version_value) };  # Returning the latest version
      }
    update_interval: never  # Manual updates only

# Define a binary sensor to indicate if an update is available
binary_sensor:
  - platform: template
    name: "Update Available"
    id: update_available
    device_class: update
    lambda: |-
      if (!id(latest_version).has_state()) return false;
      return id(latest_version).state != id(current_version).state;

# Define a button to manually check for updates
button:
  - platform: template
    name: "Check for Updates"
    icon: "mdi:update"
    on_press:
      then:
        - http_request.get:
            id: http_client
            url: "https://api.github.com/repos/chriopter/hall-9/releases/latest"
            capture_response: true  # Capture the response body
            on_response:
              then:
                - lambda: |-
                    if (response->status_code == 200) {
                      // Parse the JSON response to extract "tag_name"
                      json::parse_json(body, [&](JsonObject root) -> bool {
                        if (root.containsKey("tag_name")) {
                          std::string tag = root["tag_name"].as<std::string>();
                          // Remove leading 'v' if present (e.g., "v1.2.3" -> "1.2.3")
                          if (!tag.empty() && tag[0] == 'v') {
                            tag = tag.substr(1);
                          }
                          // Update the global variable with the latest version
                          id(latest_version_value) = tag;
                          // Publish the new state to the latest_version text sensor
                          id(latest_version).publish_state(tag.c_str());
                          ESP_LOGI("update", "Latest version fetched: %s", tag.c_str());
                        } else {
                          ESP_LOGW("update", "'tag_name' not found in the response.");
                        }
                        return true;
                      });
                    } else {
                      ESP_LOGW("update", "Failed to fetch latest version: HTTP %d", response->status_code);
                    }
