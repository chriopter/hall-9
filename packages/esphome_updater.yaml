substitutions:
  project_version: "1.1.1"  # Define the version number once here

esphome:
  name: hall-9
  friendly_name: "Hall 9 Room 1"
  project:
    name: "chriopter.hall-9"
    version: "${project_version}"  # Reference the substitution here

# Add HTTP client for GitHub API
http_request:
  useragent: esphome/hall-9
  timeout: 10s
  id: http_client

# Create text sensors for version tracking
text_sensor:
  - platform: template
    name: "Hall 9 Installed Version"
    id: current_version
    icon: "mdi:package-variant"
    update_interval: 24h
    lambda: |-
      return std::string("${project_version}");
      
  - platform: template
    name: "Latest Version"
    id: latest_version
    icon: "mdi:package-variant-closed"
    update_interval: 24h
    lambda: |-
      auto resp = id(http_client).get("https://api.github.com/repos/chriopter/hall-9/releases/latest");
      if (resp != nullptr && resp->status_code == 200) {
        std::string body = resp->get_string();
        size_t start = body.find("\"tag_name\":\"");
        if (start != std::string::npos) {
          start += 12;  // Length of "\"tag_name\":\""
          size_t end = body.find("\"", start);
          if (end != std::string::npos) {
            return body.substr(start, end - start);
          }
        }
      }
      return id(current_version).state;

button:
  - platform: template
    name: "Check for Updates"
    icon: "mdi:update"
    on_press:
      - text_sensor.template.publish:
          id: latest_version
          state: !lambda |-
            auto resp = id(http_client).get("https://api.github.com/repos/chriopter/hall-9/releases/latest");
            if (resp != nullptr && resp->status_code == 200) {
              std::string body = resp->get_string();
              size_t start = body.find("\"tag_name\":\"");
              if (start != std::string::npos) {
                start += 12;  // Length of "\"tag_name\":\""
                size_t end = body.find("\"", start);
                if (end != std::string::npos) {
                  return body.substr(start, end - start);
                }
              }
            }
            return id(current_version).state;

# Binary sensor to detect when update is available
binary_sensor:
  - platform: template
    name: "Update Available"
    id: update_available
    device_class: update
    lambda: |-
      if (!id(latest_version).has_state()) return false;
      return id(latest_version).state != id(current_version).state;
