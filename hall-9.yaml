esphome:
  on_boot:
    - light.turn_on:
        id: led_ww
        blue: 100%
        brightness: 60%
        effect: fast pulse
    - speaker.volume_set: 1.0

api:
  on_client_connected:
    then:
      - delay: 50ms
      - light.turn_off: led_ww
      - micro_wake_word.start:
  on_client_disconnected:
    then:
      - voice_assistant.stop: 

psram:
  mode: octal  # quad for N8R2 and octal for N16R8
  speed: 80MHz
    
button:
  - platform: restart
    name: "ESP32 Restart"
    id: but_rest
  
sensor:
  - platform: internal_temperature
    name: "ESP32 Internal Temperature"
  - platform: wifi_signal
    name: "ESP32 WiFi Signal Strength"
    update_interval: 60s
  - platform: uptime
    name: "ESP32  Uptime"
    update_interval: 60s
    unit_of_measurement: "s" # You can set this to "minutes" or "hours" as needed


# Contails Microphone, Speaker, Voice Assistant, Status Light and Display Configuration

 # Hardware 
i2s_audio:
  # I2S bus for INMP441 microphone input
  - id: i2s_in
    i2s_lrclk_pin: GPIO8  # Word Select (WS) pin - marks start of each audio sample
    i2s_bclk_pin: GPIO2   # Bit Clock (SCK) pin - synchronizes data transfer
  
  # I2S bus for MAX98357A speaker output
  - id: i2s_speaker
    i2s_lrclk_pin: GPIO10  # Left/Right Clock (LRC) pin - same as WS for mono
    i2s_bclk_pin: GPIO11   # Bit Clock (BCLK) pin - synchronizes data transfer

i2c:
  sda: GPIO16
  scl: GPIO15
  scan: true
  frequency: 400kHz

light:
  - platform: esp32_rmt_led_strip
    id: led_ww
    rgb_order: GRB
    pin: GPIO48
    num_leds: 1
    chipset: ws2812
    name: "on board light"
   
microphone:
  - platform: i2s_audio
    id: va_mic
    adc_type: external
    i2s_din_pin: GPIO4 #SD pin on the INMP441
    channel: left    # INMP441 outputs mono audio on left channel
    pdm: false      # INMP441 uses I2S not PDM
    i2s_audio_id: i2s_in
    bits_per_sample: 32 bit  # Maximum quality audio capture
    
speaker:
    platform: i2s_audio
    id: va_speaker
    i2s_audio_id: i2s_speaker
    dac_type: external    # MAX98357A is an external I2S DAC
    i2s_dout_pin: GPIO12  # DIN Pin of the MAX98357A Audio Amplifier
    channel: mono         # MAX98357A outputs mono audio
    bits_per_sample: 32bit  # Maximum quality audio output
    timeout: 500ms       # Time to wait for audio data before stopping playback

# Voice Assistant

globals:
  - id: voice_assistant_phase
    type: int
    initial_value: '1'  # Starting phase

micro_wake_word:
  models:
    - model: github://esphome/micro-wake-word-models/models/v2/okay_nabu.json

  on_wake_word_detected:
    - voice_assistant.start:
        wake_word: !lambda return wake_word;
    - light.turn_on:
        id: led_ww
        red: 30%
        green: 30%
        blue: 70%
        brightness: 60%
    
voice_assistant:
  id: va
  microphone: va_mic
  # Main audio processing settings
  noise_suppression_level: 2.0  # Range 0-4: Higher values reduce more background noise but may affect voice quality
  volume_multiplier: 2.0  # Increases overall output volume - adjust based on your speaker setup
  conversation_timeout: 30s  # How long to wait for next command before ending session
  
  # Voice detection and noise handling
  auto_gain: 24dB  # Automatic gain control (0-31dB): 24dB provides good amplification without distortion
  dc_filter: true  # Removes constant background noise/hum from audio signal
  speaker: va_speaker
  on_tts_start:
    - light.turn_on:
        id: led_ww           
        red: 30%
        green: 30%
        blue: 70%
        brightness: 60%
    - lambda: id(voice_assistant_phase) = 4;
    - script.execute: draw_display
  on_listening:
    - lambda: id(voice_assistant_phase) = 2;
    - script.execute: draw_display
  on_stt_end:
    - lambda: id(voice_assistant_phase) = 3;
    - script.execute: draw_display
    - light.turn_off: led_ww
  on_error:
    - micro_wake_word.start:  
  on_end:
    - light.turn_off: led_ww
    - wait_until:
        not:
          voice_assistant.is_running:
    - micro_wake_word.start: 
    - lambda: id(voice_assistant_phase) = 1;
    - script.execute: draw_display

switch:
  - platform: template
    id: mute
    name: mute
    optimistic: true
    on_turn_on: 
      - micro_wake_word.stop:
      - voice_assistant.stop:
      - light.turn_on:
          id: led_ww           
          red: 100%
          green: 0%
          blue: 0%
          brightness: 60%
      - delay: 2s
      - light.turn_off:
          id: led_ww
      - light.turn_on:
          id: led_ww           
          red: 100%
          green: 0%
          blue: 0%
          brightness: 30%
    on_turn_off:
      - micro_wake_word.start:
      - light.turn_on:
          id: led_ww           
          red: 0%
          green: 100%
          blue: 0%
          brightness: 60%
      - delay: 2s
      - light.turn_off:
          id: led_ww 
          
display:
  - platform: ssd1306_i2c
    id: onboard_display
    model: "SSD1306 128x64"
    rotation: 0
    address: 0x3C
    update_interval: 2s
    pages:
      - id: show_time
        lambda: |-
          // Print time in HH:MM format
          it.strftime(0, 60, id(font1), TextAlign::BASELINE_LEFT, "%H:%M", id(esptime).now());
      - id: show_thinking
        lambda: |-
          it.print(0, 0, id(font1), "Hmm");
      - id: show_hearing
        lambda: |-
          it.print(0, 0, id(font1), "Ja?");
      - id: show_answering
        lambda: |-
          it.print(0, 0, id(font1), "...");

# script for updating the display content
script:
  - id: draw_display
    then:
      - lambda: |
          switch(id(voice_assistant_phase)) {
            case 1:
              id(onboard_display).show_page(show_time);
              id(onboard_display).update();
              break;
            case 2:
              id(onboard_display).show_page(show_hearing);
              id(onboard_display).update();
              break;
            case 3:
              id(onboard_display).show_page(show_thinking);
              id(onboard_display).update();
              break;
            case 4:
              id(onboard_display).show_page(show_answering);
              id(onboard_display).update();
              break;
          }

font:
  - file: "https://raw.githubusercontent.com/chriopter/hall-9/main/assets/fonts/arial.ttf"
    id: font1
    size: 46


# Time configuration (using Home Assistant or NTP server)
time:
  - platform: homeassistant
    id: esptime
