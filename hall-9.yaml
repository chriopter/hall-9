packages:
  dht22: !include modules/dht22.yaml
  display: !include modules/display.yaml

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"
      # N16R8: code + rodata live in 80 MHz octal PSRAM so internal SRAM stays
      # free for audio/WiFi tasks — Voice PE-style.
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"

psram:
  mode: octal
  speed: 80MHz

logger:

api:
  on_client_connected:
    then:
      - delay: 50ms
      - light.turn_off: led_ww
      - micro_wake_word.start:
  on_client_disconnected:
    then:
      - voice_assistant.stop:

# --- I/O pins ---
i2c:
  sda: GPIO16
  scl: GPIO15
  scan: true
  frequency: 400kHz

i2s_audio:
  - id: i2s_in
    i2s_lrclk_pin: GPIO8
    i2s_bclk_pin: GPIO2
  - id: i2s_speaker
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO11

switch:
  - platform: gpio
    pin: GPIO45
    id: led_ring_power
    restore_mode: ALWAYS_ON
    internal: true

  - platform: gpio
    pin: GPIO47
    id: speaker_amp_power
    restore_mode: ALWAYS_ON
    internal: true

  - platform: template
    id: mute
    name: Mute
    optimistic: true
    on_turn_on:
      - micro_wake_word.stop:
      - voice_assistant.stop:
      - light.turn_on:
          id: led_ww
          red: 100%
          green: 0%
          blue: 0%
          brightness: 30%
    on_turn_off:
      - micro_wake_word.start:
      - light.turn_off: led_ww

binary_sensor:
  - platform: gpio
    id: center_button
    name: "Center Button"
    pin:
      number: GPIO1
      inverted: true
      mode:
        input: true
        pullup: true
    filters:
      - delayed_on: 20ms
    on_press:
      - voice_assistant.start:

number:
  - platform: template
    id: speaker_volume
    name: "Speaker Volume"
    icon: mdi:volume-high
    mode: slider
    optimistic: true
    restore_value: true
    min_value: 0.0
    max_value: 1.0
    step: 0.05
    initial_value: 0.7
    set_action:
      - speaker.volume_set:
          id: hw_speaker
          volume: !lambda "return x;"

button:
  - platform: restart
    name: "ESP32 Restart"
    id: but_rest

  - platform: template
    name: "Trigger Voice Assistant"
    icon: mdi:microphone
    on_press:
      - voice_assistant.start:

sensor:
  - platform: internal_temperature
    name: "ESP32 Internal Temperature"
  - platform: wifi_signal
    name: "ESP32 WiFi Signal Strength"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
    unit_of_measurement: "s"
light:
  - platform: esp32_rmt_led_strip
    id: led_ww
    rgb_order: GRB
    pin: GPIO48
    rmt_symbols: 96
    num_leds: 1
    chipset: ws2812
    name: "Status LED"

microphone:
  - platform: i2s_audio
    id: va_mic
    adc_type: external
    i2s_din_pin: GPIO4
    channel: left
    pdm: false
    sample_rate: 16000
    bits_per_sample: 32bit
    i2s_audio_id: i2s_in

speaker:
  # Hardware I2S speaker at 48 kHz 32-bit, kept continuously clocked
  # (`timeout: never`). The mixer upstream ensures this is fed with silence
  # between TTS bursts so the I2S DMA never underruns.
  - platform: i2s_audio
    id: hw_speaker
    i2s_audio_id: i2s_speaker
    dac_type: external
    i2s_dout_pin: GPIO12
    channel: mono
    sample_rate: 48000
    bits_per_sample: 32bit
    timeout: never
    buffer_duration: 100ms

  # Mixer combines the VA TTS resampler output with a silent keep-alive
  # source so hw_speaker is fed continuously. task_stack_in_psram moves the
  # mixer FreeRTOS stack off internal SRAM.
  - platform: mixer
    id: mixing_speaker
    output_speaker: hw_speaker
    num_channels: 1
    task_stack_in_psram: true
    source_speakers:
      - id: va_mixing_input
        timeout: never
      - id: silence_mixing_input
        timeout: never

  # Resampler upsamples VA's native 16 kHz TTS to 48 kHz for the mixer.
  - platform: resampler
    id: va_speaker
    output_speaker: va_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

# --- Voice Assistant ---
micro_wake_word:
  models:
    - model: github://esphome/micro-wake-word-models/models/v2/okay_nabu.json
    - model: github://esphome/micro-wake-word-models/models/v2/hey_jarvis.json
  on_wake_word_detected:
    - voice_assistant.start:
        wake_word: !lambda return wake_word;
    - light.turn_on:
        id: led_ww
        red: 30%
        green: 30%
        blue: 70%
        brightness: 60%

voice_assistant:
  id: va
  microphone: va_mic
  speaker: va_speaker
  # Wake word is managed externally by the micro_wake_word component — this
  # keeps VA's internal state machine from blocking at RESPONSE_FINISHED.
  use_wake_word: false
  noise_suppression_level: 0
  auto_gain: 0 dbfs
  volume_multiplier: 1.0
  conversation_timeout: 30s
  on_tts_start:
    - light.turn_on:
        id: led_ww
        red: 30%
        green: 30%
        blue: 70%
        brightness: 60%
    - lambda: id(voice_assistant_phase) = 4;
    - script.execute: draw_display
  on_listening:
    - lambda: id(voice_assistant_phase) = 2;
    - script.execute: draw_display
  on_stt_end:
    - lambda: id(voice_assistant_phase) = 3;
    - script.execute: draw_display
    - light.turn_off: led_ww
  # Fires when TTS audio playback actually finishes (Event 99). Reset the UI
  # + re-arm wake-word here, not on on_tts_end (which fires right when the TTS
  # URL is received — before any sound plays).
  on_tts_stream_end:
    - light.turn_off: led_ww
    - lambda: id(voice_assistant_phase) = 1;
    - script.execute: draw_display
    - micro_wake_word.start:
  on_error:
    - light.turn_off: led_ww
    - lambda: id(voice_assistant_phase) = 1;
    - script.execute: draw_display
    - micro_wake_word.start:
  # Backup reset for the natural IDLE transition, if VA transitions cleanly.
  on_end:
    - light.turn_off: led_ww
    - lambda: id(voice_assistant_phase) = 1;
    - script.execute: draw_display
    - micro_wake_word.start:
  on_timer_started:
    - script.execute: check_if_timers_active
    - script.execute: fetch_first_active_timer
    - script.execute: draw_display
  on_timer_updated:
    - script.execute: check_if_timers_active
    - script.execute: fetch_first_active_timer
    - script.execute: draw_display
  on_timer_tick:
    - script.execute: check_if_timers_active
    - script.execute: fetch_first_active_timer
    - script.execute: draw_display
  on_timer_cancelled:
    - script.execute: check_if_timers_active
    - script.execute: draw_display
  on_timer_finished:
    - script.execute: check_if_timers_active
    - script.execute: draw_display

time:
  - platform: homeassistant
    id: esptime
