packages:
  dht22: !include modules/dht22.yaml
  display: !include modules/display.yaml

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"
      # N16R8: code + rodata live in 80 MHz octal PSRAM so internal SRAM stays
      # free for audio/WiFi tasks — Voice PE-style.
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"

psram:
  mode: octal
  speed: 80MHz

# Apply the persisted speaker_volume slider value once components are up.
# `set_action` on the number does not fire on boot when restoring state.
# Also force-disable the stop wake-word model on boot — ESPHome persists the
# enabled state to flash, so "stop" could stay armed after a timer ring.
esphome:
  on_boot:
    priority: -100
    then:
      - speaker.volume_set:
          id: hw_speaker
          volume: !lambda |-
            float x = id(speaker_volume).state;
            return x <= 0.0f ? 0.0f : pow(x, 0.15f);
      - micro_wake_word.disable_model: stop_model

logger:

api:
  on_client_connected:
    then:
      - delay: 50ms
      - light.turn_off: led_ww
      - micro_wake_word.start:
  on_client_disconnected:
    then:
      - voice_assistant.stop:

# --- I/O pins ---
i2c:
  sda: GPIO16
  scl: GPIO15
  scan: true
  frequency: 400kHz

i2s_audio:
  - id: i2s_in
    i2s_lrclk_pin: GPIO8
    i2s_bclk_pin: GPIO2
  - id: i2s_speaker
    i2s_lrclk_pin: GPIO10
    i2s_bclk_pin: GPIO11

switch:
  - platform: gpio
    pin: GPIO45
    id: led_ring_power
    restore_mode: ALWAYS_ON
    internal: true

  - platform: gpio
    pin: GPIO47
    id: speaker_amp_power
    restore_mode: ALWAYS_ON
    internal: true

  - platform: template
    id: timer_ringing
    optimistic: true
    internal: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - light.turn_on:
          id: led_ww
          effect: "timer_ring"
      - micro_wake_word.enable_model: stop_model
      - script.execute: timer_ring_timeout
      - script.execute: ring_timer_loop
    on_turn_off:
      - script.stop: timer_ring_timeout
      - script.stop: ring_timer_loop
      - media_player.stop:
          id: announcement_media_player
      - micro_wake_word.disable_model: stop_model
      - light.turn_off: led_ww
      # Force display back to clock. Do NOT call update() from a lambda here —
      # that races with the I2C bus during audio playback and crashes SSD1306.
      # Only flip the page pointer; the 2 s auto-interval re-renders it.
      - lambda: |-
          id(is_timer_active) = false;
          id(voice_assistant_phase) = 1;
          id(onboard_display).show_page(show_time);

  - platform: template
    id: mute
    name: Mute
    optimistic: true
    on_turn_on:
      - micro_wake_word.stop:
      - voice_assistant.stop:
      - light.turn_on:
          id: led_ww
          red: 100%
          green: 0%
          blue: 0%
          brightness: 30%
    on_turn_off:
      - micro_wake_word.start:
      - light.turn_off: led_ww

script:
  - id: timer_ring_timeout
    mode: restart
    then:
      - delay: 2min
      - switch.turn_off: timer_ringing

  - id: ring_timer_loop
    mode: restart
    then:
      - while:
          condition:
            switch.is_on: timer_ringing
          then:
            - media_player.speaker.play_on_device_media_file:
                id: announcement_media_player
                media_file: timer_finished_sound
                announcement: true
            - delay: 4s

number:
  - platform: template
    id: speaker_volume
    name: "Speaker Volume"
    icon: mdi:volume-high
    mode: slider
    optimistic: true
    restore_value: true
    min_value: 0.0
    max_value: 1.0
    step: 0.05
    initial_value: 0.7
    set_action:
      # Perceptual loudness curve (pow 0.15): linear sliders feel flat because
      # hearing is logarithmic. 0.5 maps to ~0.9 real volume.
      - speaker.volume_set:
          id: hw_speaker
          volume: !lambda "return x <= 0.0f ? 0.0f : pow(x, 0.15f);"

button:
  - platform: restart
    name: "ESP32 Restart"
    id: but_rest

  - platform: template
    name: "Trigger Voice Assistant"
    icon: mdi:microphone
    on_press:
      - voice_assistant.start:

sensor:
  - platform: internal_temperature
    name: "ESP32 Internal Temperature"
  - platform: wifi_signal
    name: "ESP32 WiFi Signal Strength"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
    unit_of_measurement: "s"
light:
  - platform: esp32_rmt_led_strip
    id: led_ww
    rgb_order: GRB
    pin: GPIO48
    rmt_symbols: 96
    num_leds: 1
    chipset: ws2812
    name: "Status LED"
    effects:
      - strobe:
          name: "timer_ring"
          colors:
            - state: true
              red: 100%
              green: 0%
              blue: 0%
              brightness: 100%
              duration: 400ms
            - state: false
              duration: 400ms

microphone:
  - platform: i2s_audio
    id: va_mic
    adc_type: external
    i2s_din_pin: GPIO4
    channel: left
    pdm: false
    sample_rate: 16000
    bits_per_sample: 32bit
    i2s_audio_id: i2s_in

speaker:
  # Voice-PE-style audio chain. Finite `timeout: 500ms` everywhere (not
  # `never`) so the VA state machine can observe "speaker idle" and transition
  # back to IDLE after TTS.
  - platform: i2s_audio
    id: hw_speaker
    i2s_audio_id: i2s_speaker
    dac_type: external
    i2s_dout_pin: GPIO12
    channel: mono
    sample_rate: 48000
    bits_per_sample: 32bit
    timeout: 500ms
    buffer_duration: 100ms

  - platform: mixer
    id: mixing_speaker
    output_speaker: hw_speaker
    num_channels: 1
    task_stack_in_psram: true
    source_speakers:
      - id: va_mixing_input
        timeout: 500ms
      - id: announcement_mixing_input
        timeout: 500ms

  # VA TTS path: resamples 16 kHz → 48 kHz into the mixer.
  - platform: resampler
    id: va_speaker
    output_speaker: va_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

  # Announcement path: plays audio files (timer chime, etc.) through the
  # speaker_source media_player below, parallel to VA.
  - platform: resampler
    id: announcement_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 48000
    bits_per_sample: 16

audio_file:
  - id: timer_finished_sound
    file: sounds/timer_finished.flac

media_player:
  - platform: speaker
    id: announcement_media_player
    name: "Announcement Player"
    announcement_pipeline:
      format: FLAC
      num_channels: 1
      sample_rate: 48000
      speaker: announcement_speaker

# --- Voice Assistant ---
micro_wake_word:
  models:
    - model: okay_nabu
    - model: hey_jarvis
    # Stop model is disabled by default and enabled only while a timer rings,
    # so "stop" dismisses the timer without triggering wake word otherwise.
    # Sourced from kahrendt/microWakeWord (not in esphome/micro-wake-word-models).
    - model: https://github.com/kahrendt/microWakeWord/releases/download/stop/stop.json
      id: stop_model
      internal: true
  on_wake_word_detected:
    - if:
        condition:
          # Manifest-defined wake_word string (capital "S" per stop.json).
          lambda: return wake_word == "Stop";
        then:
          # "stop" only dismisses an active timer; never starts VA.
          - if:
              condition:
                switch.is_on: timer_ringing
              then:
                - switch.turn_off: timer_ringing
        else:
          - voice_assistant.start:
              wake_word: !lambda return wake_word;
          - light.turn_on:
              id: led_ww
              red: 30%
              green: 30%
              blue: 70%
              brightness: 60%

voice_assistant:
  id: va
  microphone: va_mic
  speaker: va_speaker
  # Wake word is managed externally by the micro_wake_word component — this
  # keeps VA's internal state machine from blocking at RESPONSE_FINISHED.
  use_wake_word: false
  noise_suppression_level: 0
  auto_gain: 0 dbfs
  volume_multiplier: 1.0
  conversation_timeout: 30s
  on_tts_start:
    - light.turn_on:
        id: led_ww
        red: 30%
        green: 30%
        blue: 70%
        brightness: 60%
    - lambda: id(voice_assistant_phase) = 4;
    - script.execute: draw_display
  on_listening:
    - light.turn_on:
        id: led_ww
        red: 30%
        green: 30%
        blue: 70%
        brightness: 60%
    - lambda: id(voice_assistant_phase) = 2;
    - script.execute: draw_display
  on_stt_end:
    - lambda: id(voice_assistant_phase) = 3;
    - script.execute: draw_display
    - light.turn_off: led_ww
  # Fires when TTS audio playback actually finishes (Event 99). Reset the UI
  # + re-arm wake-word here, not on on_tts_end (which fires right when the TTS
  # URL is received — before any sound plays).
  on_tts_stream_end:
    - light.turn_off: led_ww
    - lambda: id(voice_assistant_phase) = 1;
    - script.execute: draw_display
    - micro_wake_word.start:
  on_error:
    - light.turn_off: led_ww
    - lambda: id(voice_assistant_phase) = 1;
    - script.execute: draw_display
    - micro_wake_word.start:
  # on_end fires when the VA pipeline finishes (Event 2) — this happens while
  # the TTS audio is still playing. Do not reset the UI here; on_tts_stream_end
  # is the correct hook for "speaking is actually done". Only re-arm wake-word
  # here in case on_tts_stream_end never fires (empty TTS, error path).
  on_end:
    - micro_wake_word.start:
  on_timer_started:
    - script.execute: check_if_timers_active
    - script.execute: fetch_first_active_timer
    - script.execute: draw_display
  on_timer_updated:
    - script.execute: check_if_timers_active
    - script.execute: fetch_first_active_timer
    - script.execute: draw_display
  on_timer_tick:
    - script.execute: check_if_timers_active
    - script.execute: fetch_first_active_timer
    - script.execute: draw_display
  on_timer_cancelled:
    - script.execute: check_if_timers_active
    - script.execute: draw_display
  on_timer_finished:
    - lambda: |-
        id(is_timer_active) = false;
        id(voice_assistant_phase) = 1;
        id(onboard_display).show_page(show_time);
    - switch.turn_on: timer_ringing

time:
  - platform: homeassistant
    id: esptime
