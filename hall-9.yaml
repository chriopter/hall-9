esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"

esphome:
  on_boot:
    then:
      - light.turn_on:
          id: led_ww
          blue: 100%
          brightness: 60%
          effect: fast pulse
      - speaker.volume_set:
          id: i2s_audio_speaker
          volume: 1.0

api:
  on_client_connected:
    then:
      - delay: 50ms
      - light.turn_off: led_ww
      - micro_wake_word.start:
  on_client_disconnected:
    then:
      - voice_assistant.stop: 

psram:
  mode: octal  # quad for N8R2 and octal for N16R8
  speed: 80MHz
    
button:
  - platform: restart
    name: "ESP32 Restart"
    id: but_rest
  
sensor:
  - platform: internal_temperature
    name: "ESP32 Internal Temperature"
  - platform: wifi_signal
    name: "ESP32 WiFi Signal Strength"
    update_interval: 60s
  - platform: uptime
    name: "ESP32  Uptime"
    update_interval: 60s
    unit_of_measurement: "s" # You can set this to "minutes" or "hours" as needed


# Contails Microphone, Speaker, Voice Assistant, Status Light and Display Configuration

 # Hardware 
i2s_audio:
  # I2S bus for INMP441 microphone input
  - id: i2s_in
    i2s_lrclk_pin: GPIO8  # Word Select (WS) pin - marks start of each audio sample
    i2s_bclk_pin: GPIO2   # Bit Clock (SCK) pin - synchronizes data transfer
  
  # I2S bus for MAX98357A speaker output
  - id: i2s_speaker
    i2s_lrclk_pin: GPIO10  # Left/Right Clock (LRC) pin - same as WS for mono
    i2s_bclk_pin: GPIO11   # Bit Clock (BCLK) pin - synchronizes data transfer

i2c:
  sda: GPIO16
  scl: GPIO15
  scan: true
  frequency: 400kHz

light:
  - platform: esp32_rmt_led_strip
    id: led_ww
    rgb_order: GRB
    pin: GPIO48
    num_leds: 1
    chipset: ws2812
    name: "on board light"
    effects:
      - pulse:
          name: "pulse"
          transition_length: 0.5s
          update_interval: 0.5s
      - pulse:
          name: "fast pulse"
          transition_length: 0.3s
          update_interval: 0.3s
      - pulse:
          name: "error pulse"
          transition_length: 0.2s
          update_interval: 0.2s
   
microphone:
  - platform: i2s_audio
    id: va_mic
    adc_type: external
    i2s_din_pin: GPIO4 #SD pin on the INMP441
    channel: left    # INMP441 outputs mono audio on left channel
    pdm: false      # INMP441 uses I2S not PDM
    i2s_audio_id: i2s_in
    bits_per_sample: 32 bit  # Maximum quality audio capture
    sample_rate: 16000  # Voice input at 16kHz, will be resampled to 48kHz
    
speaker:
  # Hardware speaker output
  - platform: i2s_audio
    id: i2s_audio_speaker
    i2s_audio_id: i2s_speaker
    dac_type: external    # MAX98357A is an external I2S DAC
    i2s_dout_pin: GPIO12  # DIN Pin of the MAX98357A Audio Amplifier
    channel: mono         # MAX98357A outputs mono audio
    bits_per_sample: 16bit  # MAX98357A works best with 16-bit
    sample_rate: 48000    # Match FLAC file sample rate
    timeout: 500ms       # Time to wait for audio data before stopping playback
    buffer_duration: 100ms

  # Virtual speakers to combine the announcement and media streams together into one output
  - platform: mixer
    id: mixing_speaker
    output_speaker: i2s_audio_speaker
    num_channels: 1
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never

  # Virtual speakers to resample each pipelines' audio
  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
    sample_rate: 48000
    bits_per_sample: 16
    buffer_duration: 100ms
  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input
    sample_rate: 48000
    bits_per_sample: 16
    buffer_duration: 100ms

# Voice Assistant

globals:
  # Voice assistant phases
  - id: voice_assist_idle_phase_id
    type: int
    restore_value: no
    initial_value: '1'
  - id: voice_assist_waiting_phase_id
    type: int
    restore_value: no
    initial_value: '2'
  - id: voice_assist_listening_phase_id
    type: int
    restore_value: no
    initial_value: '3'
  - id: voice_assist_thinking_phase_id
    type: int
    restore_value: no
    initial_value: '4'
  - id: voice_assist_replying_phase_id
    type: int
    restore_value: no
    initial_value: '5'
  - id: voice_assist_error_phase_id
    type: int
    restore_value: no
    initial_value: '10'
  - id: voice_assist_not_ready_phase_id
    type: int
    restore_value: no
    initial_value: '11'
  
  # Current phase tracking
  - id: voice_assistant_phase
    type: int
    initial_value: '11'  # Start in not ready state
  
  # Timer state tracking
  - id: is_timer_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: first_active_timer
    type: voice_assistant::Timer
    restore_value: false

micro_wake_word:
  id: mww
  models:
    - model:
        url: https://github.com/kahrendt/microWakeWord/releases/download/okay_nabu_20241226.3/okay_nabu.json
        type: http
  vad:
    model:
      url: https://github.com/esphome/micro-wake-word-models/raw/main/models/v2/vad.json
      type: http
  microphone: va_mic
  on_wake_word_detected:
    - if:
        condition:
          switch.is_on: wake_sound
        then:
          - script.execute:
              id: play_sound
              priority: true
              sound_file: !lambda return id(wake_word_sound);
          - delay: 300ms
    - light.turn_on:
        id: led_ww
        red: 30%
        green: 30%
        blue: 70%
        brightness: 60%
        effect: "pulse"
    - voice_assistant.start:
        wake_word: !lambda return wake_word;
    
# Media player for sound effects
media_player:
  - platform: speaker
    id: sound_player
    name: Sound Effects
    internal: false
    volume_increment: 0.05
    volume_min: 0.4
    volume_max: 1.0
    announcement_pipeline:
      speaker: announcement_resampling_speaker
      format: FLAC
      num_channels: 1
      sample_rate: 48000
    media_pipeline:
      speaker: media_resampling_speaker
      format: FLAC
      num_channels: 1
      sample_rate: 48000
    on_announcement:
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 20
          duration: 0.0s
    on_state:
      if:
        condition:
          and:
            - not:
                voice_assistant.is_running:
            - not:
                media_player.is_announcing:
        then:
          - mixer_speaker.apply_ducking:
              id: media_mixing_input
              decibel_reduction: 0
              duration: 1.0s
    files:
      - id: wake_word_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/wake_word_triggered.flac
      - id: timer_finished_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/timer_finished.flac
      - id: error_sound
        file: https://github.com/esphome/home-assistant-voice-pe/raw/dev/sounds/error_cloud_expired.mp3

voice_assistant:
  id: va
  microphone: va_mic
  # Main audio processing settings
  volume_multiplier: 3.0  # Increases overall output volume - adjust based on your speaker setup
  conversation_timeout: 30s  # How long to wait for next command before ending session
  noise_suppression_level: 0
  auto_gain: 0 dbfs
  
  # Voice detection and noise handling
  speaker: announcement_resampling_speaker
  
  # TTS pipeline configuration for server responses
  tts_pipeline:
    format: WAV  # Server typically sends WAV files
    sample_rate: 22050  # Common TTS sample rate - adjust if needed
    num_channels: 1
  
  on_start:
    - if:
        condition:
          switch.is_on: wake_sound
        then:
          - script.execute:
              id: play_sound
              priority: true
              sound_file: !lambda return id(wake_word_sound);
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 20
        duration: 0.0s
    - lambda: id(voice_assistant_phase) = id(voice_assist_waiting_phase_id);
    - script.execute: draw_display
    
  on_tts_start:
    - light.turn_on:
        id: led_ww           
        red: 30%
        green: 30%
        blue: 70%
        brightness: 60%
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 20
        duration: 0.0s
    - lambda: id(voice_assistant_phase) = id(voice_assist_replying_phase_id);
    - script.execute: draw_display
    
  on_tts_end:
    - delay: 500ms  # Give a small buffer for audio to complete playback
    - lambda: id(voice_assistant_phase) = id(voice_assist_idle_phase_id);
    - script.execute: draw_display
    - voice_assistant.stop:
    
  on_listening:
    - lambda: id(voice_assistant_phase) = id(voice_assist_listening_phase_id);
    - script.execute: draw_display
    
  on_stt_end:
    - lambda: id(voice_assistant_phase) = id(voice_assist_thinking_phase_id);
    - script.execute: draw_display
    - light.turn_off: led_ww
    
  on_error:
    - lambda: id(voice_assistant_phase) = id(voice_assist_error_phase_id);
    - script.execute: draw_display
    - script.execute:
        id: play_sound
        priority: true
        sound_file: !lambda return id(error_sound);
    - delay: 2s
    - micro_wake_word.start:
    
  on_end:
    - light.turn_off: led_ww
    - wait_until:
        not:
          voice_assistant.is_running:
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 0
        duration: 1.0s
    - micro_wake_word.start: 
    - lambda: id(voice_assistant_phase) = id(voice_assist_idle_phase_id);
    - script.execute: draw_display
    
  on_timer_finished:
    - script.execute:
        id: play_sound
        priority: true
        sound_file: !lambda return id(timer_finished_sound);
    - light.turn_on:
        id: led_ww
        red: 100%
        green: 100%
        blue: 0%
        brightness: 100%
        effect: pulse
    
  on_timer_started:
    - script.execute: check_if_timers_active
    - script.execute: fetch_first_active_timer
    - script.execute: draw_display
    
  on_timer_cancelled:
    - script.execute: check_if_timers_active
    - script.execute: draw_display
    
  on_timer_updated:
    - script.execute: check_if_timers_active
    - script.execute: fetch_first_active_timer
    - script.execute: draw_display
    
  on_timer_tick:
    - script.execute: fetch_first_active_timer
    - script.execute: draw_display

# Switches for device control
switch:
  - platform: template
    id: mute
    name: mute
    optimistic: true
    on_turn_on: 
      - micro_wake_word.stop:
      - voice_assistant.stop:
      - light.turn_on:
          id: led_ww           
          red: 100%
          green: 0%
          blue: 0%
          brightness: 60%
          effect: "error pulse"
      - delay: 2s
      - light.turn_off:
          id: led_ww
      - light.turn_on:
          id: led_ww           
          red: 100%
          green: 0%
          blue: 0%
          brightness: 30%
    on_turn_off:
      - micro_wake_word.start:
      - light.turn_on:
          id: led_ww           
          red: 0%
          green: 100%
          blue: 0%
          brightness: 60%
          effect: "pulse"
      - delay: 2s
      - light.turn_off:
          id: led_ww
  - platform: template
    id: wake_sound
    name: Wake sound
    icon: "mdi:bullhorn"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

          
display:
  - platform: ssd1306_i2c
    id: onboard_display
    model: "SSD1306 128x64"
    rotation: 0
    address: 0x3C
    update_interval: 2s
    pages:
      - id: show_time
        lambda: |-
          if (id(is_timer_active)) {
            // Show timer countdown when active
            auto seconds_left = id(first_active_timer).seconds_left;
            int minutes = seconds_left / 60;
            int seconds = seconds_left % 60;
            it.printf(0, 32, id(font1), TextAlign::BASELINE_LEFT, "%02d:%02d", minutes, seconds);
            it.printf(0, 60, id(font1), TextAlign::BASELINE_LEFT, "Timer");
          } else {
            // Print time in HH:MM format
            it.strftime(0, 60, id(font1), TextAlign::BASELINE_LEFT, "%H:%M", id(esptime).now());
          }
      - id: show_thinking
        lambda: |-
          it.print(0, 32, id(font1), "Hmm");
      - id: show_hearing
        lambda: |-
          it.print(0, 32, id(font1), "Ja?");
      - id: show_answering
        lambda: |-
          it.print(0, 32, id(font1), "...");
      - id: show_error
        lambda: |-
          it.print(0, 32, id(font1), "Error");
      - id: show_not_ready
        lambda: |-
          it.print(0, 32, id(font1), "Wait");

# Scripts for display and timer management
script:
  - id: draw_display
    then:
      - lambda: |
          switch(id(voice_assistant_phase)) {
            case 1:  // idle
              id(onboard_display).show_page(show_time);
              id(onboard_display).update();
              break;
            case 2:  // waiting
              id(onboard_display).show_page(show_hearing);
              id(onboard_display).update();
              break;
            case 3:  // listening
              id(onboard_display).show_page(show_thinking);
              id(onboard_display).update();
              break;
            case 4:  // thinking
              id(onboard_display).show_page(show_thinking);
              id(onboard_display).update();
              break;
            case 5:  // replying
              id(onboard_display).show_page(show_answering);
              id(onboard_display).update();
              break;
            case 10:  // error
              id(onboard_display).show_page(show_error);
              id(onboard_display).update();
              break;
            case 11:  // not ready
              id(onboard_display).show_page(show_not_ready);
              id(onboard_display).update();
              break;
          }

  # Script to check if any timers are active
  - id: check_if_timers_active
    then:
      - lambda: |
          const auto timers = id(va).get_timers();
          bool output = false;
          if (timers.size() > 0) {
            for (auto &iterable_timer : timers) {
              if(iterable_timer.second.is_active) {
                output = true;
              }
            }
          }
          id(is_timer_active) = output;

  # Script to fetch the first active timer
  - id: fetch_first_active_timer
    then:
      - lambda: |
          const auto timers = id(va).get_timers();
          auto output_timer = timers.begin()->second;
          for (auto &iterable_timer : timers) {
            if (iterable_timer.second.is_active && iterable_timer.second.seconds_left <= output_timer.seconds_left) {
              output_timer = iterable_timer.second;
            }
          }
          id(first_active_timer) = output_timer;

  # Script executed when we want to play sounds on the device
  - id: play_sound
    parameters:
      priority: bool
      sound_file: "audio::AudioFile*"
    then:
      - lambda: |-
          if (priority) {
            id(sound_player)
              ->make_call()
              .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_STOP)
              .set_announcement(true)
              .perform();
          }
          if ( (id(sound_player).state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING ) || priority) {
            id(sound_player)
              ->play_file(sound_file, true, false);
          }

font:
  - file: "https://raw.githubusercontent.com/chriopter/hall-9/main/assets/fonts/arial.ttf"
    id: font1
    size: 46


# Time configuration (using Home Assistant or NTP server)
time:
  - platform: homeassistant
    id: esptime
