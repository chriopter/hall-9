# SSD1306 status display: single page whose lambda reads voice_assistant_phase
# + timer state on every render tick and draws the appropriate content.
# No show_page() switching — every 500 ms the display re-reads state.
# Depends on: i2c bus + voice_assistant id `va` (declared in hall-9.yaml).

globals:
  - id: voice_assistant_phase
    type: int
    initial_value: '1'

  - id: first_active_timer
    type: voice_assistant::Timer
    restore_value: false

  - id: is_timer_active
    type: bool
    restore_value: false
    initial_value: 'false'

font:
  # Tabular digits + bpp:1 give crisp, fixed-width time/timer rendering with
  # no anti-aliased dithering (SSD1306 is 1-bit — no grayscale).
  - file: "gfonts://Roboto Mono"
    id: font_mono
    size: 40
    bpp: 1
  - file: "assets/fonts/karla-medium.ttf"
    id: font_lg
    size: 54
    bpp: 1
  - file: "assets/fonts/karla-medium.ttf"
    id: font_md
    size: 28
    bpp: 1

display:
  - platform: ssd1306_i2c
    id: onboard_display
    model: "SSD1306 128x64"
    rotation: 0
    address: 0x3C
    update_interval: 500ms
    lambda: |-
      if (id(is_timer_active)) {
        uint32_t s = id(first_active_timer).seconds_left;
        char buf[8];
        snprintf(buf, sizeof(buf), "%02d:%02d", s / 60, s % 60);
        it.print(64, 32, id(font_mono), TextAlign::CENTER, buf);
        return;
      }
      switch (id(voice_assistant_phase)) {
        case 2:
          it.print(64, 32, id(font_lg), TextAlign::CENTER, "Ja?");
          return;
        case 3:
          it.print(64, 32, id(font_lg), TextAlign::CENTER, "Hmm");
          return;
        case 4:
          it.print(64, 32, id(font_lg), TextAlign::CENTER, "...");
          return;
      }
      auto t = id(esptime).now();
      if (t.is_valid()) {
        it.strftime(64, 32, id(font_mono), TextAlign::CENTER, "%H:%M", t);
      } else {
        it.print(64, 32, id(font_mono), TextAlign::CENTER, "--:--");
      }

script:
  - id: fetch_first_active_timer
    then:
      - lambda: |-
          const auto &timers = id(va).get_timers();
          if (timers.empty()) return;
          auto output_timer = *timers.begin();
          for (const auto &timer : timers) {
            if (timer.is_active && timer.seconds_left <= output_timer.seconds_left) {
              output_timer = timer;
            }
          }
          id(first_active_timer) = output_timer;

  - id: check_if_timers_active
    then:
      - lambda: |-
          const auto &timers = id(va).get_timers();
          bool active = false;
          for (const auto &timer : timers) {
            if (timer.is_active) {
              active = true;
            }
          }
          id(is_timer_active) = active;

